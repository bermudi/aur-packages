name: opencode2-bin (check)

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      new_version: ${{ steps.check.outputs.new_version }}
      checksum: ${{ steps.check.outputs.checksum }}
      aarch64_sha: ${{ steps.check.outputs.aarch64_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check AUR package status (exists? published version?)
        id: aur_exists
        env:
          AUR_NAME: opencode2-bin
        run: |
          # AUR returns resultcount:0 for an unclaimed name. A brand-new (or
          # deleted) package must be published even when our repo PKGBUILD
          # already matches upstream, so the first run seeds it.
          #
          # We also capture the AUR Version (pkgver-pkgrel). The compare step
          # uses it to detect a publish that landed in this repo but not on
          # AUR — e.g. an AUR push that failed mid-flight during a maintenance
          # window — and re-publish on the next run instead of silently
          # sticking a version behind.
          # Transient AUR network errors (TLS resets etc.) must not fail the run:
          # retry the RPC a few times before giving up.
          rpc=$(curl -fsSL --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://aur.archlinux.org/rpc/?v=5&type=info&arg[]=${AUR_NAME}")
          count=$(printf '%s\n' "$rpc" | grep -oE '"resultcount":[0-9]+' | cut -d: -f2)
          if [[ "$count" == "0" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "aur_version=" >> "$GITHUB_OUTPUT"
            echo "AUR package '${AUR_NAME}' does not exist yet -> will seed"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            aur_version=$(printf '%s\n' "$rpc" | grep -oE '"Version":"[^"]*"' | head -1 | sed -E 's/"Version":"//; s/"$//')
            echo "aur_version=$aur_version" >> "$GITHUB_OUTPUT"
            echo "AUR package '${AUR_NAME}' exists at version ${aur_version}"
          fi

      - name: Fetch latest version + checksums from npm
        id: latest
        run: |
          # opencode v2 has no GitHub releases; it ships per-arch binaries as
          # npm packages (@opencode-ai/cli-linux-{x64,arm64}). The `next`
          # dist-tag of the @opencode-ai/cli stub tracks the v2 channel.
          #
          # Version: 0.0.0-next-17444 -> Arch: 0.0.0_next_17444 ('-' -> '_').
          # Checksums: npm's dist.integrity is "sha512-<base64>"; decode the
          # base64 to the raw digest and re-encode as hex for sha512sums.
          # No tarball download needed — this is the canonical npm checksum.
          npm_meta=$(curl -fsSL "https://registry.npmjs.org/@opencode-ai%2fcli/next")
          npmver=$(printf '%s\n' "$npm_meta" | grep -oE '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [[ -z "$npmver" ]]; then
            echo "ERROR: could not parse version from @opencode-ai/cli/next"
            printf '%s\n' "$npm_meta"
            exit 1
          fi
          arch_version=$(echo "$npmver" | tr '-' '_')
          echo "npm version: $npmver"
          echo "arch version: $arch_version"

          decode_integrity() {
            local pkg="$1"
            local meta b64 hex
            meta=$(curl -fsSL "https://registry.npmjs.org/${pkg}/${npmver}")
            b64=$(printf '%s\n' "$meta" | grep -oE '"integrity":"sha512-[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^sha512-//')
            if [[ -z "$b64" ]]; then
              echo "ERROR: could not parse integrity for ${pkg}"
              exit 1
            fi
            hex=$(printf '%s' "$b64" | base64 -d | od -An -tx1 | tr -d ' \n')
            if [[ ! "$hex" =~ ^[a-f0-9]{128}$ ]]; then
              echo "ERROR: integrity decode for ${pkg} did not yield a 128-char sha512 hex ($hex)"
              exit 1
            fi
            printf '%s' "$hex"
          }

          sha512_x86_64=$(decode_integrity "@opencode-ai/cli-linux-x64")
          sha512_aarch64=$(decode_integrity "@opencode-ai/cli-linux-arm64")
          echo "sha512 x86_64:  $sha512_x86_64"
          echo "sha512 aarch64: $sha512_aarch64"

          echo "arch_version=$arch_version" >> "$GITHUB_OUTPUT"
          echo "checksum=$sha512_x86_64" >> "$GITHUB_OUTPUT"
          echo "aarch64_sha=$sha512_aarch64" >> "$GITHUB_OUTPUT"

      - name: Read current version from repo PKGBUILD
        id: current
        run: |
          pkgver=$(grep -E '^pkgver=' opencode2-bin/PKGBUILD | head -1 | cut -d= -f2)
          pkgrel=$(grep -E '^pkgrel=' opencode2-bin/PKGBUILD | head -1 | cut -d= -f2)
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"
          # Full pkgver-pkgrel, same shape as the AUR RPC "Version" field, so
          # the compare step also catches pkgrel-only drift (fix commits) and
          # a published-but-not-pushed-to-AUR state.
          echo "full_version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: check
        run: |
          current="${{ steps.current.outputs.version }}"
          repo_full="${{ steps.current.outputs.full_version }}"
          latest="${{ steps.latest.outputs.arch_version }}"
          aur_exists="${{ steps.aur_exists.outputs.exists }}"
          aur_version="${{ steps.aur_exists.outputs.aur_version }}"
          echo "Current version: $current"
          echo "Latest version:  $latest"
          echo "AUR exists:      $aur_exists"
          echo "AUR version:     ${aur_version:-<none>}"
          echo "Repo full ver:   $repo_full"
          # Publish when ANY of these hold:
          #  - upstream advanced past what the repo has (normal bump)
          #  - the AUR package is missing (first run / re-creation after deletion)
          #  - the AUR lags the repo: a publish landed in this repo but the
          #    AUR push failed mid-flight (e.g. an AUR maintenance window).
          #    Re-publishing heals the desync on the next run instead of
          #    silently sticking a version behind.
          if [[ "$current" != "$latest" || "$aur_exists" == "false" || "$repo_full" != "$aur_version" ]]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$latest" >> "$GITHUB_OUTPUT"
            echo "checksum=${{ steps.latest.outputs.checksum }}" >> "$GITHUB_OUTPUT"
            echo "aarch64_sha=${{ steps.latest.outputs.aarch64_sha }}" >> "$GITHUB_OUTPUT"
            echo "Publishing (version bump, initial seed, or AUR reconciliation)"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "No update available"
          fi

  update:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    uses: ./.github/workflows/update-aur.yml
    with:
      pkgdir: opencode2-bin
      aur_name: opencode2-bin
      version: ${{ needs.check.outputs.new_version }}
      checksum: ${{ needs.check.outputs.checksum }}
      aarch64_sha: ${{ needs.check.outputs.aarch64_sha }}
    secrets: inherit