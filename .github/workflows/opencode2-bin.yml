name: opencode2-bin (auto-bump, NO AUR)

# opencode2-bin is retired from the AUR (2026-10-21, commit 092a4b7) and
# resurrected 2026-10-23 as a LOCAL-ONLY package by operator direction:
# while upstream's own `opencode-bin` AUR package is being fixed by its
# maintainer (thdxr), this repo just keeps the PKGBUILD current and tags a
# release. bermudi's machine consumes it via: git pull -> makepkg -> pacman -U.
#
# RED LINE: this workflow must NEVER publish to the AUR. No update-aur.yml
# call, no AUR steps, no AUR RPC gates, no AUR_SSH_PRIVATE_KEY. There is
# deliberately no code path to aur.archlinux.org here. If the package ever
# returns to the AUR, restore the old update-aur.yml wiring from git history
# (parent of 092a4b7) instead of reinventing it in this file.

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest version + checksums from npm
        id: latest
        run: |
          # opencode v2 has no GitHub releases; it ships per-arch binaries as
          # npm packages (@opencode/cli-linux-{x64,arm64}).
          # 2026-10-08: upstream moved scope @opencode-ai/* -> @opencode/*
          # (the old scope went silent 2026-09-07 with no deprecation notice)
          # and v2 went stable — the `latest` dist-tag of @opencode/cli now
          # carries semver 2.0.x. Poll `latest`; the `beta`/`dev` tags still
          # carry build-numbered prereleases (`dev` churns several builds/day).
          # If this package ever goes stale again, first check the scope/tags:
          # https://registry.npmjs.org/-/package/@opencode/cli/dist-tags
          #
          # Version: 2.0.24 -> Arch: 2.0.24 ('-' -> '_' if a prerelease ever
          # lands on `latest`).
          # Checksums: npm's dist.integrity is "sha512-<base64>"; decode the
          # base64 to the raw digest and re-encode as hex for sha512sums.
          # No tarball download needed — this is the canonical npm checksum.
          npm_meta=$(curl -fsSL "https://registry.npmjs.org/@opencode%2fcli/latest")
          npmver=$(printf '%s\n' "$npm_meta" | grep -oE '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [[ -z "$npmver" ]]; then
            echo "ERROR: could not parse version from @opencode/cli latest tag"
            printf '%s\n' "$npm_meta"
            exit 1
          fi
          arch_version=$(echo "$npmver" | tr '-' '_')
          echo "npm version: $npmver"
          echo "arch version: $arch_version"

          decode_integrity() {
            local pkg="$1"
            local meta b64 hex
            meta=$(curl -fsSL "https://registry.npmjs.org/${pkg}/${npmver}")
            b64=$(printf '%s\n' "$meta" | grep -oE '"integrity":"sha512-[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^sha512-//')
            if [[ -z "$b64" ]]; then
              echo "ERROR: could not parse integrity for ${pkg}"
              exit 1
            fi
            hex=$(printf '%s' "$b64" | base64 -d | od -An -tx1 | tr -d ' \n')
            if [[ ! "$hex" =~ ^[a-f0-9]{128}$ ]]; then
              echo "ERROR: integrity decode for ${pkg} did not yield a 128-char sha512 hex ($hex)"
              exit 1
            fi
            printf '%s' "$hex"
          }

          sha512_x86_64=$(decode_integrity "@opencode/cli-linux-x64")
          sha512_aarch64=$(decode_integrity "@opencode/cli-linux-arm64")
          echo "sha512 x86_64:  $sha512_x86_64"
          echo "sha512 aarch64: $sha512_aarch64"

          echo "arch_version=$arch_version" >> "$GITHUB_OUTPUT"
          echo "checksum=$sha512_x86_64" >> "$GITHUB_OUTPUT"
          echo "aarch64_sha=$sha512_aarch64" >> "$GITHUB_OUTPUT"

      - name: Compare with repo PKGBUILD
        id: check
        run: |
          current=$(grep -E '^pkgver=' opencode2-bin/PKGBUILD | head -1 | cut -d= -f2)
          latest="${{ steps.latest.outputs.arch_version }}"
          echo "Repo version:   $current"
          echo "Latest version: $latest"
          # pkgver-only comparison: with no AUR to reconcile against there is
          # no pkgrel-drift detection; pkgrel bumps are hand commits.
          if [[ "$current" != "$latest" ]]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$latest" >> "$GITHUB_OUTPUT"
            echo "Update available: $current -> $latest"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "No update available"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.has_update == 'true'
        run: |
          bash .github/scripts/update-pkgbuild.sh opencode2-bin \
            "${{ steps.check.outputs.new_version }}" \
            "${{ steps.latest.outputs.checksum }}" \
            "" \
            "${{ steps.latest.outputs.aarch64_sha }}"

      - name: Generate .SRCINFO
        if: steps.check.outputs.has_update == 'true'
        run: bash .github/scripts/generate-srcinfo.sh opencode2-bin

      - name: Validate PKGBUILD syntax
        if: steps.check.outputs.has_update == 'true'
        run: bash -n opencode2-bin/PKGBUILD

      - name: Commit and push
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opencode2-bin/PKGBUILD opencode2-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(opencode2-bin): update to ${{ steps.check.outputs.new_version }}"
          git push

      - name: Create GitHub release
        if: steps.check.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opencode2-bin-v${{ steps.check.outputs.new_version }}
          name: "opencode2-bin ${{ steps.check.outputs.new_version }}"
          body: |
            Automated update of `opencode2-bin` to ${{ steps.check.outputs.new_version }}.

            Local-only package (NOT published to the AUR). Install:
            `git pull && cd opencode2-bin && makepkg -fi`

            - Checksum x86_64: `${{ steps.latest.outputs.checksum }}`
            - Checksum aarch64: `${{ steps.latest.outputs.aarch64_sha }}`
          draft: false
          prerelease: false
