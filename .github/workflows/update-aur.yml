name: Update AUR

on:
  workflow_call:
    inputs:
      pkgdir:
        description: 'Directory (from repo root) containing the package sources'
        required: true
        type: string
      aur_name:
        description: 'AUR package name (the SSH repo to push to)'
        required: true
        type: string
      version:
        description: 'New package version in Arch format'
        required: true
        type: string
      checksum:
        description: 'Hex checksum of the primary artifact (sha256 or sha512)'
        required: true
        type: string
      aarch64_sha:
        description: 'Hex checksum for the aarch64 arch-specific checksum array (npm-sourced packages)'
        required: false
        type: string
      filename:
        description: 'Artifact path from the APT Packages file (for pool-change detection)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to latest origin
        run: |
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Update PKGBUILD
        run: bash .github/scripts/update-pkgbuild.sh "${{ inputs.pkgdir }}" "${{ inputs.version }}" "${{ inputs.checksum }}" "${{ inputs.filename }}" "${{ inputs.aarch64_sha }}"

      - name: Generate .SRCINFO
        run: bash .github/scripts/generate-srcinfo.sh "${{ inputs.pkgdir }}"

      - name: Validate PKGBUILD syntax
        run: bash -n "${{ inputs.pkgdir }}/PKGBUILD"

      - name: Verify Electron dependency matches upstream
        run: bash .github/scripts/check-electron-dep.sh "${{ inputs.pkgdir }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.pkgdir }}/PKGBUILD" "${{ inputs.pkgdir }}/.SRCINFO"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(${{ inputs.aur_name }}): update to ${{ inputs.version }}"
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.aur_name }}-v${{ inputs.version }}
          name: "${{ inputs.aur_name }} ${{ inputs.version }}"
          body: |
            Automated update of `${{ inputs.aur_name }}` to ${{ inputs.version }}.

            - Checksum: `${{ inputs.checksum }}`
          draft: false
          prerelease: false

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKGDIR: ${{ inputs.pkgdir }}
          AUR_NAME: ${{ inputs.aur_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret not configured; skipping AUR push."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/id_aur
            StrictHostKeyChecking accept-new
          EOF
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          AUR_URL="ssh://aur@aur.archlinux.org/${AUR_NAME}.git"

          # Clone the AUR repo with a short bounded retry. AUR's git/SSH layer
          # periodically emits "The AUR is down due to maintenance" for a
          # minute or two while its RPC (used below to check existence) stays
          # up; a few retries ride those blips out instead of failing the
          # whole publish. Each attempt is logged so this is never a black box.
          clone_aur() {
            local url="$1" dest="$2" attempt
            for attempt in 1 2 3 4; do
              if git clone "$url" "$dest"; then return 0; fi
              rm -rf "$dest"
              if [[ "$attempt" -lt 4 ]]; then
                echo "AUR clone attempt $attempt failed; retrying in 20s..."
                sleep 20
              fi
            done
            return 1
          }

          # Clone-or-init: AUR does not auto-create the git repo on clone, so
          # a brand-new package must be pushed into existence. Decide whether
          # the package exists via the RPC info endpoint (authoritative) rather
          # than treating *any* failed clone as "not found" — a failed clone
          # can also mean AUR is down for maintenance or a transient
          # network/auth error, none of which should make us reinitialize (and
          # silently clobber) an existing package's history.
          rpc=$(curl -fsSL --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://aur.archlinux.org/rpc/?v=5&type=info&arg[]=${AUR_NAME}" 2>/dev/null || true)
          aur_count=$(printf '%s\n' "$rpc" | grep -oE '"resultcount":[0-9]+' | head -1 | cut -d: -f2 || true)

          if [[ "$aur_count" == "0" ]]; then
            echo "AUR package '${AUR_NAME}' does not exist yet; initializing for first push."
            rm -rf aur-repo
            mkdir aur-repo
            git -C aur-repo init -b master
            git -C aur-repo remote add origin "$AUR_URL"
          elif clone_aur "$AUR_URL" aur-repo; then
            echo "Cloned existing AUR repo."
          else
            echo "::error::Failed to clone AUR repo '${AUR_NAME}' after retries (is AUR down for maintenance?). Refusing to reinitialize an existing package."
            exit 1
          fi

          # Replace AUR working tree with the package sources (keep .git).
          pushd aur-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "../${PKGDIR}/." .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "AUR repository already up to date; nothing to push."
            exit 0
          fi

          git commit -m "Update ${AUR_NAME} to ${VERSION}"
          git push origin HEAD:master
          popd
